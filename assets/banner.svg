<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240">
  <defs>
    <pattern id="tartan" width="96" height="96" patternUnits="userSpaceOnUse">
      <rect width="96" height="96" fill="#C41230"/>
      <rect x="0" y="0" width="30" height="96" fill="#8F0D24" opacity="0.55"/>
      <rect x="0" y="0" width="96" height="30" fill="#8F0D24" opacity="0.55"/>
      <rect x="44" y="0" width="4" height="96" fill="#1E1E1E" opacity="0.35"/>
      <rect x="0" y="44" width="96" height="4" fill="#1E1E1E" opacity="0.35"/>
      <rect x="72" y="0" width="2" height="96" fill="#FFFFFF" opacity="0.18"/>
      <rect x="0" y="72" width="96" height="2" fill="#FFFFFF" opacity="0.18"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="m"><rect width="1200" height="240" fill="url(#fade)"/></mask>
  </defs>
  <rect width="1200" height="240" rx="14" fill="#C41230"/>
  <rect width="1200" height="240" rx="14" fill="url(#tartan)" mask="url(#m)"/>
  <text x="64" y="118" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" fill="#FFFFFF">Jianing Zhang</text>
  <rect x="66" y="140" width="72" height="3" fill="#FFFFFF" opacity="0.85"/>
  <text x="64" y="182" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#FFFFFF" opacity="0.95">M.S. in Computer Vision @ Carnegie Mellon University</text>
</svg>
